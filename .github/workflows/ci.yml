name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q app src scripts tests
      - name: Run tests
        run: python -m pip install pytest && python -m pytest -q
      - name: Ruff
        run: python -m pip install ruff && ruff check app src scripts tests
      - name: Mypy
        run: python -m pip install mypy && mypy app/backend/settings.py src/ingestion/ingest.py src/retrieval/provider.py src/retrieval/pgvector.py

  container:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: POSTGRES_PASSWORD=ci-only docker compose config -q

      - name: Build Docker image
        run: docker build -t caiel:ci .
      - name: Inspect image
        run: docker image inspect caiel:ci >/dev/null
